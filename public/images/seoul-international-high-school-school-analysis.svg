    <text x="28" y="7" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#111">우리학교 과외</text>
  </g>
  <text x="65" y="110" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="24" font-weight="900" fill="#111">우리학교 과외</text>

  <g font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" filter="url(#textShadow)">
