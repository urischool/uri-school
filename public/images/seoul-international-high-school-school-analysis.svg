      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17224a" flood-opacity=".13"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#111" flood-opacity=".18"/>
    </filter>
    <clipPath id="photoClip">
      <path d="M452 300c0-66 54-120 120-120h68v274H452z"/>
    </clipPath>
  </defs>

  <rect width="720" height="560" fill="#f7f9fd"/>
