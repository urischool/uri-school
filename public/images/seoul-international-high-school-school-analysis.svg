    <text x="65" y="292" font-size="65" font-weight="1000" fill="#263f97" letter-spacing="-2">국제고등학교</text>
    <text x="65" y="388" font-size="74" font-weight="1000" fill="#050505" letter-spacing="-2">학교분석</text>
  </g>

  <text x="65" y="466" font-family="Pretendard, 'Noto Sans KR', Arial, sans-serif" font-size="22" font-weight="900" fill="#111827">우리학교과외 분석팀</text>

