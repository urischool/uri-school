  </g>

  <g transform="translate(65 38)">
    <circle cx="28" cy="28" r="25" fill="#fff" stroke="#111" stroke-width="2.4"/>
    <circle cx="28" cy="28" r="16" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <rect x="18" y="21" width="20" height="18" rx="2" fill="#2446d8"/>
